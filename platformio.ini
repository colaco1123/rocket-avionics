; Rocket flight computer, ground stations and CanSat test firmware (ESP32-S3).
;
; Board definition: boards/t-beams3-supreme.json (from SERIOUS ROCKETRY)
; Libraries: vendored in lib/, copied unchanged from SERIOUS ROCKETRY, so the
; exact same versions build here and nothing is downloaded at build time.

[platformio]
default_envs = flight

[env]
platform      = espressif32@6.13.0
framework     = arduino
board         = t-beams3-supreme
upload_speed  = 921600          ; drop to 460800 if uploads fail
monitor_speed = 115200
monitor_filters = send_on_enter, time, esp32_exception_decoder
monitor_echo  = yes
board_build.partitions = huge_app.csv

; Vendored in lib/ (versions as copied):
;   RadioLib 7.7.1, TinyGPS++ 1.0.0, Adafruit BME280 Library 2.2.2,
;   Adafruit BusIO 1.14.1, Adafruit Unified Sensor 1.1.7,
;   SensorLib 0.4.1 (QMI8658, QMC6310, PCF8563),
;   XPowersLib 0.2.6 (AXP2101),
;   ThingPulse ESP8266/ESP32 OLED driver 4.1.0 (SH1106Wire).
; Registry equivalent, if lib/ is ever dropped (remove the matching lib/
; folder first or the two copies will clash):
; lib_deps =
;     jgromes/RadioLib@7.7.1
;     mikalhart/TinyGPSPlus@1.0.0
;     adafruit/Adafruit BME280 Library@2.2.2
;     adafruit/Adafruit BusIO@1.14.1
;     adafruit/Adafruit Unified Sensor@1.1.7
;     lewisxhe/SensorLib@0.4.1
;     lewisxhe/XPowersLib@0.2.6
;     thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.1.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

; Rocket flight computer: src/rocket/main.cpp
[env:flight]
build_src_filter = +<rocket/>

; Ground station LoRa <-> USB bridge for dashboard/index.html: src/ground/main.cpp
[env:ground]
build_src_filter = +<ground/>

; Web ground station (ESP32-S3-WROOM-1U-N16R8 + SX1262 LoRa): src/webground/main.cpp
[env:webground]
board            = esp32-s3-devkitc-1
board_upload.flash_size  = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_src_filter = +<webground/>
lib_deps =
    knolleary/PubSubClient@2.8

; CanSat ground test firmware (ESP32-S3 DevKitC-1): src/cansat/main.cpp
[env:cansat]
board            = esp32-s3-devkitc-1
board_upload.flash_size  = 4MB        ; this board has 4 MB flash (the devkitc-1 profile says 8 MB)
board_upload.maximum_size = 4194304
build_src_filter = +<cansat/>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library@^2.6.8
